[project]
name = "oli"
version = "0.1.0"
description = "Oli — a personal AI assistant with voice, memory, web tools, and proactive tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.40",
    "browser-use>=0.1.40",
    "playwright>=1.47",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "ddgs>=6.0",
    "python-dotenv>=1.0",
    "fastembed>=0.4",
    "numpy>=1.26",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "langgraph>=0.2.40",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pgvector>=0.3",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oli"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["alembic"]  # autogenerated migrations

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI uses function calls (Depends/File) in argument defaults

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["oli"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/oli"]
branch = true
