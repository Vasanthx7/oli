[project]
name = "oli"
version = "0.1.0"
description = "Oli — a personal AI assistant with voice, memory, web tools, and proactive tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.40",
    "browser-use>=0.1.40",
    "playwright>=1.47",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "ddgs>=6.0",
    "python-dotenv>=1.0",
    "fastembed>=0.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oli"]

[tool.ruff]
line-length = 100
target-version = "py311"
