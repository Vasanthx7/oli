name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      # The local embedding model (~90MB) downloads once; cache it across runs.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: data/models
          key: fastembed-bge-small-en-v1.5

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Mypy (types)
        run: uv run mypy src/oli

      # Tests are fully offline: conftest injects a dummy key and temp DB, so no
      # secrets are required in CI.
      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing
