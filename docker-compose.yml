# Full local stack. Bring it up with:
#   docker compose up --build
# Then open http://localhost:8000. Requires GROQ_API_KEY in .env.
#
# Just the database (to develop the app on the host):
#   docker compose up -d db
#   DATABASE_URL=postgresql+asyncpg://oli:oli@localhost:5432/oli uv run uvicorn oli.main:app

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: oli
      POSTGRES_PASSWORD: oli
      POSTGRES_DB: oli
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oli -d oli"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
    env_file: .env  # supplies GROQ_API_KEY (and any overrides)
    environment:
      DATABASE_URL: postgresql+asyncpg://oli:oli@db:5432/oli
      HOST: 0.0.0.0
      PORT: "8000"
      ENVIRONMENT: production
      LOG_JSON: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Optional monitoring stack. Start with:  docker compose --profile monitoring up
  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  grafana-data:
